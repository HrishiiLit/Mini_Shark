[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-shark"
version = "0.1.0"
description = "Network Traffic Analyzer and Protocol Analysis System"
requires-python = ">=3.11"
dependencies = [
    "dpkt>=1.9.8",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
live = ["scapy>=2.5"]
dev = ["pytest>=8", "httpx>=0.27", "anyio>=4", "ruff>=0.17", "black>=26.10", "pre-commit>=4"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]

[tool.ruff.lint]
select = ["E","F","W","C","N","B","I","R","RUF","SIM","TID","UP"]
fixable = ["ALL"]
exclude = [".github/workflows/"]


[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
